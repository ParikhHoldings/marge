<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marge - Pastoral Secretary Workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23315f46'/%3E%3Cpath d='M32 51V21m0 30c-8-13-18-18-26-18 7-14 17-18 26-11m0 29c8-13 18-18 26-18-7-14-17-18-26-11m0-1c0-8 4-13 12-15-7 0-12 3-12 10 0-7-5-10-12-10 8 2 12 7 12 15Z' fill='none' stroke='%23fffdf8' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f7f1e7;
      --paper-deep: #efe4d3;
      --surface: #fffdf8;
      --surface-warm: #fbf7ef;
      --ink: #25231f;
      --muted: #736c61;
      --quiet: #9a9183;
      --sage: #315f46;
      --sage-soft: #e4eee6;
      --sage-line: rgba(49, 95, 70, .18);
      --gold: #a8792c;
      --gold-soft: #f2e4c7;
      --red: #b64236;
      --red-soft: #f7dfda;
      --line: rgba(62, 51, 38, .13);
      --shadow: 0 20px 55px rgba(55, 42, 25, .08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(90deg, rgba(49,95,70,.06) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, rgba(168,121,44,.06) 0 1px, transparent 1px 100%),
        var(--paper);
      background-size: 42px 42px;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 420px;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 30px 20px;
      border-right: 1px solid var(--line);
      background: rgba(255, 253, 248, .62);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border: 1px solid var(--sage-line);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--sage);
      background: var(--surface);
    }

    .brand h1 {
      margin: 0;
      font-family: Lora, Georgia, serif;
      font-size: 2rem;
      line-height: 1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .nav {
      display: grid;
      gap: 7px;
    }

    .nav button {
      width: 100%;
      border: 0;
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      font-weight: 600;
    }

    .nav button svg {
      width: 18px;
      height: 18px;
      color: currentColor;
      flex: 0 0 auto;
    }

    .nav button.active {
      background: var(--sage);
      color: white;
      box-shadow: 0 10px 20px rgba(49, 95, 70, .18);
    }

    .sidebar-card {
      margin-top: auto;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .78);
      border-radius: var(--radius);
      padding: 16px;
    }

    .sidebar-card h2 {
      margin: 0 0 10px;
      font-family: Lora, Georgia, serif;
      font-size: 1.05rem;
    }

    .week-row, .profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: .82rem;
      padding: 6px 0;
    }

    .profile-row {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--sage);
      font-weight: 700;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .avatar.small {
      width: 34px;
      height: 34px;
      font-size: .82rem;
    }

    .main {
      padding: 34px 28px 38px;
      min-width: 0;
    }

    .main-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 24px;
    }

    .kicker {
      color: var(--gold);
      font-weight: 700;
      margin: 0 0 8px;
    }

    .main-title {
      margin: 0;
      font-family: Lora, Georgia, serif;
      font-size: clamp(1.85rem, 3.2vw, 2.75rem);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .main-sub {
      color: var(--muted);
      margin: 12px 0 0;
      max-width: 720px;
      line-height: 1.6;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: flex-end;
    }

    .btn {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 10px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: .9rem;
      font-weight: 700;
      box-shadow: 0 1px 0 rgba(255,255,255,.8) inset;
      white-space: nowrap;
    }

    .btn svg {
      width: 17px;
      height: 17px;
    }

    .btn.primary {
      background: var(--sage);
      color: white;
      border-color: var(--sage);
    }

    .btn.secondary {
      background: var(--surface-warm);
      border-color: var(--line);
      color: var(--sage);
    }

    .btn.warn {
      color: var(--red);
      background: var(--red-soft);
      border-color: rgba(182, 66, 54, .22);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .72);
      border-radius: var(--radius);
      padding: 16px;
      min-height: 118px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(54, 42, 23, .04);
    }

    .stat strong {
      font-family: Lora, Georgia, serif;
      font-size: 2.2rem;
      line-height: 1;
      font-weight: 600;
    }

    .stat span {
      color: var(--muted);
      line-height: 1.35;
      font-size: .88rem;
    }

    .panel {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .82);
      border-radius: var(--radius);
      box-shadow: 0 14px 40px rgba(55, 42, 25, .05);
      margin-bottom: 18px;
    }

    .panel-head {
      padding: 18px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-family: Lora, Georgia, serif;
      font-size: 1.3rem;
    }

    .panel-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.45;
    }

    .rows {
      display: grid;
    }

    .care-row {
      display: grid;
      grid-template-columns: 8px minmax(190px, 1fr) minmax(180px, 1.1fr) minmax(150px, .8fr) auto;
      gap: 14px;
      align-items: stretch;
      padding: 0;
      border-bottom: 1px solid var(--line);
    }

    .care-row:last-child {
      border-bottom: 0;
    }

    .priority-bar {
      background: var(--sage);
    }

    .priority-high { background: var(--red); }
    .priority-medium { background: var(--gold); }
    .priority-low { background: var(--sage); }

    .row-cell {
      padding: 15px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .row-cell.stack {
      align-items: flex-start;
      flex-direction: column;
      gap: 4px;
    }

    .row-actions {
      padding: 13px 14px 13px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .name {
      font-weight: 750;
      color: var(--ink);
    }

    .meta-text, .muted {
      color: var(--muted);
      font-size: .87rem;
      line-height: 1.45;
    }

    .tiny {
      color: var(--quiet);
      font-size: .76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: .76rem;
      font-weight: 800;
      background: var(--sage-soft);
      color: var(--sage);
    }

    .tag.high {
      background: var(--red-soft);
      color: var(--red);
    }

    .tag.medium {
      background: var(--gold-soft);
      color: #7d591c;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .search {
      width: min(340px, 100%);
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 11px 12px;
      color: var(--ink);
      outline: none;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .record-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .82);
      padding: 15px;
      display: grid;
      gap: 10px;
    }

    .record-card h3 {
      margin: 0;
      font-family: Lora, Georgia, serif;
      font-size: 1.08rem;
    }

    .record-card .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .tell-panel {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .88);
      border-radius: var(--radius);
      padding: 17px;
      box-shadow: var(--shadow);
    }

    .assistant-board {
      display: grid;
      gap: 18px;
    }

    .brief-hero {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(255,253,248,.94), rgba(245,237,223,.78));
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .brief-hero-top {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .brief-hero h2 {
      margin: 0;
      font-family: Lora, Georgia, serif;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      line-height: 1.15;
    }

    .suggested-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .conversation {
      display: grid;
      gap: 15px;
    }

    .message {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 11px;
      align-items: start;
    }

    .message.user {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .message.user .message-body {
      order: 1;
      justify-self: end;
      background: var(--sage-soft);
      border-color: var(--sage-line);
    }

    .message.user .avatar {
      order: 2;
    }

    .message-body {
      width: min(660px, 100%);
      border: 1px solid var(--line);
      background: rgba(255,253,248,.9);
      border-radius: var(--radius);
      padding: 13px;
      line-height: 1.55;
      box-shadow: 0 8px 24px rgba(55,42,25,.04);
    }

    .message-body p {
      margin: 0 0 10px;
    }

    .message-body p:last-child {
      margin-bottom: 0;
    }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }

    .message-action-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .message-action-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(250,246,236,.82);
      padding: 10px;
    }

    .message-action-card strong,
    .message-action-card .meta-text {
      overflow-wrap: anywhere;
    }

    .desk-section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,253,248,.9);
      padding: 13px;
      margin-bottom: 12px;
    }

    .desk-section h3 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .desk-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.35;
    }

    .desk-row:first-of-type {
      border-top: 0;
    }

    .desk-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .desk-actions .btn {
      min-height: 32px;
      padding: 6px 9px;
      font-size: .78rem;
    }

    .work-list {
      display: grid;
      gap: 10px;
    }

    .work-row {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,253,248,.9);
      padding: 13px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .work-row strong {
      display: block;
      margin-bottom: 5px;
    }

    .work-row .row-actions {
      grid-column: auto;
      padding: 0;
    }

    .assistant-split {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 14px;
    }

    .assistant-mini {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .time-block {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      color: var(--muted);
      line-height: 1.45;
      font-size: .9rem;
    }

    .time-block:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .time-block strong {
      color: var(--ink);
    }

    .integration-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .integration-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,253,248,.88);
      padding: 14px;
      display: grid;
      gap: 9px;
    }

    .integration-card h3 {
      margin: 0;
      font-family: Lora, Georgia, serif;
      font-size: 1.08rem;
    }

    .desk-count {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: var(--sage-soft);
      color: var(--sage);
      font-size: .78rem;
      font-weight: 850;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      background: var(--sage);
      margin-right: 6px;
    }

    .status-dot.warn {
      background: var(--gold);
    }

    .tell-panel h2 {
      margin: 0 0 10px;
      font-family: Lora, Georgia, serif;
      font-size: 1.3rem;
    }

    .tell-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .tell-row input {
      border: 1px solid var(--line);
      background: white;
      border-radius: var(--radius);
      min-height: 48px;
      padding: 12px 14px;
      outline: none;
    }

    .chips {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255,255,255,.68);
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
    }

    .chat-history {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
      max-height: 170px;
      overflow: auto;
    }

    .bubble {
      width: fit-content;
      max-width: 88%;
      border-radius: var(--radius);
      padding: 9px 11px;
      font-size: .9rem;
      line-height: 1.45;
    }

    .bubble.user {
      margin-left: auto;
      color: white;
      background: var(--sage);
    }

    .bubble.marge {
      background: var(--sage-soft);
      color: #214533;
    }

    .detail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: rgba(255, 253, 248, .72);
      backdrop-filter: blur(18px);
      padding: 22px;
    }

    .detail-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .88);
      padding: 16px;
      margin-bottom: 14px;
    }

    .detail-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .detail-person {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .detail h2, .detail h3 {
      font-family: Lora, Georgia, serif;
      margin: 0;
    }

    .detail h2 {
      font-size: 1.5rem;
      line-height: 1.15;
    }

    .detail h3 {
      font-size: 1.12rem;
      margin-bottom: 10px;
    }

    .detail-list {
      display: grid;
      gap: 9px;
    }

    .detail-item {
      border: 1px solid var(--line);
      background: white;
      border-radius: var(--radius);
      padding: 11px;
      line-height: 1.45;
      color: var(--ink);
      font-size: .9rem;
    }

    .suggested {
      white-space: pre-wrap;
      line-height: 1.55;
      color: var(--ink);
      font-size: .92rem;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,253,248,.58);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(38, 33, 27, .46);
    }

    .modal.open {
      display: grid;
    }

    .modal-card {
      width: min(620px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 26px 80px rgba(0,0,0,.24);
      padding: 20px;
    }

    .modal-card h2 {
      font-family: Lora, Georgia, serif;
      margin: 0 0 6px;
      font-size: 1.45rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .form-grid label, .form-full {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .84rem;
      font-weight: 700;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .form-grid input, .form-grid select, .form-grid textarea {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
      background: white;
      color: var(--ink);
      outline: none;
      font-weight: 500;
    }

    .form-grid textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.45;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 80;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      background: var(--sage);
      color: white;
      border-radius: var(--radius);
      padding: 11px 14px;
      box-shadow: var(--shadow);
      font-weight: 700;
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .mobile-detail-toggle {
      display: none;
    }

    @media (max-width: 1360px) {
      .app-shell {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .detail {
        display: none;
        position: fixed;
        inset: 0 0 0 auto;
        width: min(430px, 100%);
        z-index: 40;
        box-shadow: -20px 0 60px rgba(0,0,0,.18);
      }

      body.detail-open .detail {
        display: block;
      }

      .mobile-detail-toggle {
        display: inline-flex;
      }
    }

    @media (max-width: 860px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: auto;
        padding: 14px;
        gap: 13px;
      }

      .nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .nav::-webkit-scrollbar {
        display: none;
      }

      .nav button {
        width: auto;
        flex: 0 0 auto;
        padding: 10px 12px;
      }

      .sidebar-card {
        display: none;
      }

      .main {
        padding: 22px 14px 34px;
      }

      .main-head {
        display: grid;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .stats, .mini-grid {
        grid-template-columns: 1fr;
      }

      .assistant-split, .integration-grid {
        grid-template-columns: 1fr;
      }

      .brief-hero-top {
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
      }

      .brief-hero-top .btn {
        grid-column: 2;
        justify-self: start;
      }

      .brief-hero h2 {
        font-size: 1.55rem;
      }

      .care-row {
        grid-template-columns: 7px minmax(0, 1fr);
      }

      .work-row {
        grid-template-columns: 1fr;
      }

      .message-action-card {
        grid-template-columns: 1fr;
      }

      .row-cell.stack, .row-actions {
        grid-column: 2;
      }

      .row-actions {
        justify-content: flex-start;
        padding: 0 14px 14px 0;
      }

      .work-row .row-actions {
        grid-column: 1;
        padding: 0;
      }

      .tell-row {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21V8m0 13c-2.8-4.7-6.2-6.4-9-6.3C5.3 10 8.7 8.4 12 10.4M12 21c2.8-4.7 6.2-6.4 9-6.3-2.3-4.7-5.7-6.3-9-4.3M12 8c0-2.7 1.4-4.5 4-5-2.5 0-4 .8-4 3.2C12 3.8 10.5 3 8 3c2.6.5 4 2.3 4 5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <h1>Marge</h1>
          <p>Pastoral secretary</p>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-card">
        <h2>Secretary Desk</h2>
        <div class="week-row"><span id="sideEmailLabel">Email</span><strong id="sideEmail">Loading</strong></div>
        <div class="week-row"><span id="sideCalendarLabel">Calendar</span><strong id="sideCalendar">Loading</strong></div>
        <div class="week-row"><span id="sideCareLabel">Care</span><strong id="sideCare">Loading</strong></div>
        <div class="profile-row">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="avatar small" id="sideAvatar">M</div>
            <div>
              <div class="name" id="sidePastor">Pastor</div>
              <div class="meta-text" id="sideChurch">Your church</div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-head">
        <div>
          <p class="kicker" id="kicker">Good morning.</p>
          <h1 class="main-title" id="pageTitle">Marge is waking up.</h1>
          <p class="main-sub" id="pageSub">Loading the pastoral workspace...</p>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="modeBtn"></button>
          <button class="btn secondary mobile-detail-toggle" id="detailToggle" data-action="open-detail">Desk</button>
          <button class="btn primary" id="topPrimaryAction" data-action="open-form" data-form="account">Create workspace</button>
          <button class="btn secondary" id="topSecondaryAction" data-prompt="What will you learn about my ministry?">Learn plan</button>
        </div>
      </div>

      <section id="content"></section>
    </main>

    <aside class="detail" id="detail"></aside>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = window.location.origin;
    let startupLoginToken = "";
    const navItems = [
      ["assistant", "Assistant", "M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z"],
      ["today", "Today", "M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"],
      ["people", "People", "M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"],
      ["care", "Care Board", "M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z"],
      ["visitors", "Visitors", "M18 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm9.5-1v6m3-3h-6"],
      ["prayer", "Prayer", "M8 11V5a2 2 0 1 1 4 0v6M12 11V4a2 2 0 1 1 4 0v9M8 11V7a2 2 0 1 0-4 0v7a8 8 0 0 0 16 0v-2a2 2 0 1 0-4 0v2"],
      ["email", "Email", "M4 6h16v12H4V6Zm0 1 8 6 8-6"],
      ["calendar", "Calendar", "M8 7V3m8 4V3M4 11h16M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"],
      ["integrations", "Integrations", "M7 8a4 4 0 0 1 4-4h2m4 12a4 4 0 0 1-4 4h-2M8 12h8M7 16l-3-4 3-4m10 0 3 4-3 4"],
      ["agents", "Agent Tools", "M14.7 6.3a4 4 0 0 0-5.4 5.4l-5.6 5.6a2 2 0 1 0 3 3l5.6-5.6a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.1-2.1 2.8-2.8Z"],
      ["plan", "Plan", "M8 7V3m8 4V3M4 11h16M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"]
    ];

    const startupParams = new URLSearchParams(location.search);
    const inviteAccountToken = startupParams.get("invite_token") || startupParams.get("marge_token") || "";
    startupLoginToken = startupParams.get("login_token") || "";
    if (inviteAccountToken) {
      startupParams.delete("invite_token");
      startupParams.delete("marge_token");
    }
    if (startupLoginToken) {
      startupParams.delete("login_token");
    }
    if (inviteAccountToken || startupLoginToken) {
      const cleanQuery = startupParams.toString();
      history.replaceState({}, "", `${location.pathname}${cleanQuery ? `?${cleanQuery}` : ""}`);
    }
    const storedAccountToken = inviteAccountToken || localStorage.getItem("margeAccountToken") || "";
    if (storedAccountToken) localStorage.removeItem("margeAccountToken");

    const state = {
      mode: new URLSearchParams(location.search).get("mode") === "demo" ? "demo" : "live",
      view: "assistant",
      accountToken: storedAccountToken,
      loginToken: startupLoginToken,
      briefing: null,
      profile: null,
      desk: null,
      members: [],
      visitors: [],
      care: [],
      prayers: [],
      actions: [],
      connectedItems: [],
      auditLog: [],
      policies: [],
      config: null,
      selected: null,
      selectedDetail: null,
      chat: [],
      loading: true,
      authRequired: false,
      search: ""
    };

    const els = {
      nav: document.getElementById("nav"),
      content: document.getElementById("content"),
      detail: document.getElementById("detail"),
      kicker: document.getElementById("kicker"),
      pageTitle: document.getElementById("pageTitle"),
      pageSub: document.getElementById("pageSub"),
      modeBtn: document.getElementById("modeBtn"),
      modal: document.getElementById("modal"),
      modalContent: document.getElementById("modalContent"),
      toast: document.getElementById("toast"),
      sideEmail: document.getElementById("sideEmail"),
      sideEmailLabel: document.getElementById("sideEmailLabel"),
      sideCalendar: document.getElementById("sideCalendar"),
      sideCalendarLabel: document.getElementById("sideCalendarLabel"),
      sideCare: document.getElementById("sideCare"),
      sideCareLabel: document.getElementById("sideCareLabel"),
      sideAvatar: document.getElementById("sideAvatar"),
      sidePastor: document.getElementById("sidePastor"),
      sideChurch: document.getElementById("sideChurch")
    };

    function icon(path) {
      return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="${path}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

    function initials(name) {
      return (name || "Marge").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "M";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function formatDate(value) {
      if (!value) return "Not logged";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    function daysSince(value) {
      if (!value) return null;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return null;
      return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    async function api(path, options = {}) {
      const accountHeaders = state.accountToken ? { "x-marge-account-token": state.accountToken } : {};
      const res = await fetch(`${API_BASE}${path}`, {
        ...options,
        credentials: "same-origin",
        headers: {
          "content-type": "application/json",
          ...accountHeaders,
          ...(options.headers || {})
        }
      });
      if (!res.ok) {
        const text = await res.text();
        const error = new Error(text || `${res.status} ${res.statusText}`);
        error.status = res.status;
        error.body = text;
        throw error;
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function isAccountTokenError(error) {
      if (error?.status !== 401) return false;
      const body = String(error.body || error.message || "").toLowerCase();
      return body.includes("account token") || body.includes("invalid marge account token");
    }

    function enterWorkspaceRequiredMode(hadToken = false) {
      localStorage.removeItem("margeAccountToken");
      state.accountToken = "";
      state.authRequired = true;
      state.mode = "live";
      state.view = "assistant";
      state.briefing = null;
      state.desk = null;
      state.profile = null;
      state.members = [];
      state.visitors = [];
      state.care = [];
      state.prayers = [];
      state.actions = [];
      state.connectedItems = [];
      state.auditLog = [];
      state.policies = [];
      state.chat = [];
      state.selected = null;
      state.selectedDetail = null;
      setQueryMode();
    }

    async function establishBrowserSession(durationHours = 168) {
      const session = await api("/assistant/sessions", {
        method: "POST",
        body: JSON.stringify({ duration_hours: durationHours })
      });
      state.accountToken = "";
      return session;
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove("show"), 2400);
    }

    function setQueryMode() {
      const params = new URLSearchParams(location.search);
      params.set("mode", state.mode);
      history.replaceState({}, "", `${location.pathname}?${params}`);
    }

    async function loadData() {
      state.loading = true;
      render();
      try {
        const config = await api("/assistant/config");
        state.config = config;
        let currentSession = null;
        if (state.loginToken) {
          try {
            await api("/assistant/login-links/exchange", {
              method: "POST",
              body: JSON.stringify({ token: state.loginToken, duration_hours: 168 })
            });
            state.loginToken = "";
            state.accountToken = "";
            toast("Signed in to your Marge workspace.");
          } catch (error) {
            state.loginToken = "";
            console.error(error);
            toast("That sign-in link is expired or already used.");
          }
        }
        try {
          currentSession = currentSession || await api("/assistant/sessions/current");
          if (currentSession.token_type === "user" && state.accountToken) {
            try {
              await establishBrowserSession();
              currentSession = await api("/assistant/sessions/current");
            } catch (sessionError) {
              console.error(sessionError);
            }
          }
        } catch (error) {
          if (isAccountTokenError(error)) {
            const hadToken = Boolean(state.accountToken);
            enterWorkspaceRequiredMode(hadToken);
            if (hadToken) toast("That workspace token is no longer valid. Create or reconnect a workspace.");
            return;
          }
          throw error;
        }
        const hasWorkspaceSession = Boolean(currentSession?.account);
        if (state.mode === "live" && !hasWorkspaceSession) {
          state.briefing = null;
          state.desk = null;
          state.profile = null;
          state.actions = [];
          state.connectedItems = [];
          state.auditLog = [];
          state.policies = [];
          state.chat = [];
          state.members = [];
          state.visitors = [];
          state.care = [];
          state.prayers = [];
          state.selected = null;
          state.selectedDetail = null;
          return;
        }
        const [briefing, desk, actions, connectedItems, auditLog, policies, chatHistory] = await Promise.all([
          api(`/briefing/today?mode=${state.mode}`),
          api(`/assistant/desk?mode=${state.mode}`),
          hasWorkspaceSession ? api("/assistant/actions?status=all&limit=50") : Promise.resolve([]),
          hasWorkspaceSession ? api("/assistant/connected-items?limit=20") : Promise.resolve([]),
          hasWorkspaceSession ? api("/assistant/audit-log?limit=12") : Promise.resolve([]),
          hasWorkspaceSession ? api("/assistant/policies") : Promise.resolve([]),
          hasWorkspaceSession ? api("/assistant/chat/history?limit=20") : Promise.resolve([])
        ]);
        state.briefing = briefing;
        state.desk = desk;
        state.profile = desk.profile;
        state.actions = actions;
        state.connectedItems = connectedItems;
        state.auditLog = auditLog;
        state.policies = policies;
        state.chat = (chatHistory || []).map(message => ({
          who: message.role === "user" ? "user" : "marge",
          text: message.content,
          intent: message.intent || "",
          saved: Boolean(message.saved),
          actionCount: message.action_count || 0,
          actions: message.actions || [],
          prompts: message.suggested_prompts || []
        }));
        if (state.mode === "live") {
          const [members, visitors, care, prayers] = await Promise.all([
            api("/members/?limit=200"),
            api("/visitors/?limit=200"),
            api("/care/?limit=200"),
            api("/care/prayers/?include_private=true&limit=200")
          ]);
          state.members = members;
          state.visitors = visitors;
          state.care = care;
          state.prayers = prayers;
        } else {
          hydrateDemoCollections();
        }
        if (!state.selected) {
          const firstCare = state.care.find(c => c.member_id);
          if (firstCare) state.selected = { type: "member", id: firstCare.member_id, fallbackName: firstCare.member_name };
        }
      } catch (error) {
        if (isAccountTokenError(error)) {
          const hadToken = Boolean(state.accountToken);
          enterWorkspaceRequiredMode(hadToken);
          if (hadToken) toast("That workspace token is no longer valid. Create or reconnect a workspace.");
        } else {
          console.error(error);
          toast("Marge had trouble loading. Check the connection and try again.");
        }
      } finally {
        state.loading = false;
        render();
        if (state.selected?.type === "member" && state.mode === "live") {
          loadSelectedMember(state.selected.id);
        }
      }
    }

    function hydrateDemoCollections() {
      const b = state.briefing || {};
      const byId = new Map();
      [...(b.birthdays_this_week || []), ...(b.anniversaries_this_week || []), ...(b.absent_members || [])].forEach(m => {
        const [first_name, ...last] = (m.full_name || "Demo Member").split(" ");
        byId.set(m.id, {
          id: m.id,
          first_name,
          last_name: last.join(" ") || "Member",
          full_name: m.full_name,
          email: m.email,
          phone: m.phone,
          birthday: m.birthday,
          anniversary: m.anniversary,
          last_attendance: m.last_attendance,
          created_at: new Date().toISOString()
        });
      });
      (b.active_care_cases || []).forEach(c => {
        if (!byId.has(c.member_id)) {
          const [first_name, ...last] = (c.member_name || "Demo Member").split(" ");
          byId.set(c.member_id, {
            id: c.member_id,
            first_name,
            last_name: last.join(" ") || "Member",
            full_name: c.member_name,
            created_at: new Date().toISOString()
          });
        }
      });
      state.members = Array.from(byId.values());
      state.visitors = b.visitors_needing_followup || [];
      state.care = b.active_care_cases || [];
      state.prayers = b.unanswered_prayers || [];
    }

    async function loadSelectedMember(memberId) {
      try {
        state.selectedDetail = await api(`/members/${memberId}`);
        renderDetail();
      } catch (error) {
        console.error(error);
      }
    }

    function getStats() {
      if (state.mode !== "demo" && !hasWorkspaceContext()) {
        return { attention: 0, followups: 0, prayers: 0, visitors: 0 };
      }
      const b = state.briefing || {};
      const deskStats = state.desk?.stats || {};
      return {
        attention: deskStats.attention ?? ((b.active_care_cases || []).length + (b.absent_members || []).length + (b.visitors_needing_followup || []).length + (b.unanswered_prayers || []).length),
        followups: deskStats.drafts ?? ((b.visitors_needing_followup || []).length + (b.active_care_cases || []).length),
        prayers: deskStats.prayers ?? ((b.unanswered_prayers || []).length || state.prayers.filter(p => p.status === "active").length),
        visitors: deskStats.visitors ?? ((b.visitors_needing_followup || []).length || state.visitors.length)
      };
    }

    function priorityItems() {
      if (state.mode !== "demo" && !hasWorkspaceContext()) return [];
      const b = state.briefing || {};
      const items = [];
      (b.active_care_cases || []).forEach(c => {
        const stale = daysSince(c.last_contact);
        items.push({
          type: "care",
          id: c.id,
          member_id: c.member_id,
          name: c.member_name || "Unknown",
          priority: !c.last_contact || stale > 10 ? "high" : "medium",
          reason: `${label(c.category)} care${c.description ? ` - ${c.description}` : ""}`,
          next: c.last_contact ? `Last contact ${formatDate(c.last_contact)}` : "No contact logged",
          draftKind: "care",
          situation: c.category || "general"
        });
      });
      (b.visitors_needing_followup || []).forEach(v => {
        items.push({
          type: "visitor",
          id: v.id,
          name: v.full_name,
          priority: "high",
          reason: `Visited ${formatDate(v.visit_date)}${v.notes ? ` - ${v.notes}` : ""}`,
          next: "Draft a welcome note",
          draftKind: "visitor"
        });
      });
      (b.unanswered_prayers || []).forEach(p => {
        items.push({
          type: "prayer",
          id: p.id,
          member_id: p.member_id,
          name: p.submitted_by || "Anonymous",
          priority: p.is_private ? "high" : "medium",
          reason: p.request_text,
          next: "Check in on this prayer request",
          draftKind: "prayer"
        });
      });
      (b.absent_members || []).forEach(m => {
        items.push({
          type: "absence",
          id: m.id,
          member_id: m.id,
          name: m.full_name,
          priority: daysSince(m.last_attendance) > 35 ? "high" : "medium",
          reason: `${daysSince(m.last_attendance) || "Several"} days since last attendance`,
          next: "Send a gentle check-in",
          draftKind: "absence"
        });
      });
      (b.birthdays_this_week || []).forEach(m => {
        items.push({
          type: "birthday",
          id: m.id,
          member_id: m.id,
          name: m.full_name,
          priority: "low",
          reason: `Birthday ${formatDate(m.birthday)}`,
          next: "Send birthday text",
          draftKind: "birthday"
        });
      });
      (b.anniversaries_this_week || []).forEach(m => {
        items.push({
          type: "anniversary",
          id: m.id,
          member_id: m.id,
          name: m.full_name,
          priority: "low",
          reason: `Anniversary ${formatDate(m.anniversary)}`,
          next: "Send anniversary note",
          draftKind: "anniversary"
        });
      });
      return items;
    }

    function label(value) {
      if (!value) return "";
      const normalized = String(value).replace(/[_-]/g, " ").replace(/\b\w/g, ch => ch.toUpperCase());
      return normalized
        .replace(/\bOauth\b/g, "OAuth")
        .replace(/\bApi\b/g, "API")
        .replace(/\bMcp\b/g, "MCP")
        .replace(/\bRms\b/g, "RMS");
    }

    function providerDisplayName(provider) {
      const integration = (state.desk?.integrations || []).find(item => item.provider === provider);
      return integration?.display_name || label(provider);
    }

    function isSyncableProvider(provider) {
      return ["google_workspace", "planning_center", "rock", "microsoft_365", "breeze"].includes(provider);
    }

    function isConnectedForSync(item) {
      return item && isSyncableProvider(item.provider) && ["connected", "configured", "available"].includes(item.status);
    }

    function canSyncIntegration(item) {
      return isConnectedForSync(item) && Boolean(item.verified_at);
    }

    function connectorNeedsVerification(item) {
      return isConnectedForSync(item) && !item.verified_at;
    }

    function connectorActionButton(item, options = {}) {
      const style = options.primary ? "primary" : "secondary";
      if (canSyncIntegration(item)) {
        const text = options.short ? `Sync ${item.display_name}` : "Sync now";
        return `<button class="btn ${style}" data-action="integration-sync" data-provider="${escapeHtml(item.provider)}">${escapeHtml(text)}</button>`;
      }
      if (connectorNeedsVerification(item)) {
        const text = options.short ? `Check ${item.display_name}` : "Check credentials";
        return `<button class="btn ${style}" data-action="integration-verify" data-provider="${escapeHtml(item.provider)}">${escapeHtml(text)}</button>`;
      }
      const text = options.short ? `Connect ${item?.display_name || "tools"}` : "Start setup";
      return `<button class="btn ${style}" data-action="integration-start" data-provider="${escapeHtml(item?.provider || "google_workspace")}">${escapeHtml(text)}</button>`;
    }

    function verifiedToolCount(integrations = state.desk?.integrations || []) {
      return integrations.filter(item => item.provider !== "mcp" && canSyncIntegration(item)).length;
    }

    function render() {
      renderNav();
      renderSidebar();
      renderHeader();
      renderMain();
      renderDetail();
    }

    function renderNav() {
      els.nav.innerHTML = navItems.map(([id, name, path]) => `
        <button class="${state.view === id ? "active" : ""}" data-view="${id}">
          ${icon(path)}
          <span>${name}</span>
        </button>
      `).join("");
    }

    function renderSidebar() {
      const hasWorkspace = hasWorkspaceContext();
      const pastor = currentPastorName();
      const church = currentChurchName();
      const profile = currentProfile();
      const needsContext = state.mode !== "demo" && hasWorkspace && !profile.onboarding_complete;
      const setupSteps = state.desk?.setup_steps || [];
      const firstSetupStep = setupSteps[0] || null;
      const needsSetup = state.mode !== "demo" && hasWorkspace && profile.onboarding_complete && firstSetupStep;
      const connectedCount = verifiedToolCount();

      if (state.mode !== "demo" && !hasWorkspace) {
        setSidebarRows([
          ["Workspace", "Start"],
          ["Context", "Next"],
          ["Tools", "Secure"],
        ]);
      } else if (needsContext) {
        const question = state.desk?.interview_question;
        setSidebarRows([
          ["Profile", `${profile.completion_percent || 0}%`],
          ["Next", question?.label || "Question"],
          ["Tools", connectedCount ? `${connectedCount} ready` : "0 ready"],
        ]);
      } else if (needsSetup) {
        setSidebarRows([
          ["Profile", "Ready"],
          ["Next", firstSetupStep.action || firstSetupStep.title || "Setup"],
          ["Tools", connectedCount ? `${connectedCount} ready` : "0 ready"],
        ]);
      } else {
        const emailDrafts = state.desk?.email_drafts?.length ?? state.desk?.stats?.drafts ?? 0;
        const calendarBlocks = state.desk?.calendar_blocks?.length ?? 0;
        const attention = state.desk?.priorities?.length ?? state.desk?.stats?.attention ?? getStats().attention;
        const approvals = activeActions().length || state.desk?.approvals?.length || 0;
        setSidebarRows([
          ["Email", `${emailDrafts} draft${emailDrafts === 1 ? "" : "s"}`],
          ["Calendar", `${calendarBlocks} block${calendarBlocks === 1 ? "" : "s"}`],
          ["Care", attention ? `${attention} to review` : (approvals ? `${approvals} approval${approvals === 1 ? "" : "s"}` : "Clear")],
        ]);
      }
      els.sideAvatar.textContent = initials(pastor);
      els.sidePastor.textContent = pastor;
      els.sideChurch.textContent = church;
    }

    function setSidebarRows(rows) {
      const targets = [
        [els.sideEmailLabel, els.sideEmail],
        [els.sideCalendarLabel, els.sideCalendar],
        [els.sideCareLabel, els.sideCare],
      ];
      rows.forEach(([labelText, value], index) => {
        targets[index][0].textContent = labelText;
        targets[index][1].textContent = value;
      });
    }

    function currentProfile() {
      return state.desk?.profile || state.profile || {};
    }

    function hasWorkspaceContext() {
      const profile = currentProfile();
      return Boolean(state.accountToken || profile.account_slug);
    }

    function currentPastorName() {
      const profile = currentProfile();
      if (state.mode !== "demo" && !hasWorkspaceContext()) return "Pastor";
      return state.desk?.pastor_name || profile.pastor_name || (state.mode === "demo" ? "Pastor Nathan" : "Pastor");
    }

    function currentChurchName() {
      const profile = currentProfile();
      if (state.mode !== "demo" && !hasWorkspaceContext()) return "your church";
      return state.desk?.church_name || profile.church_name || (state.mode === "demo" ? "Hallmark Church" : "your church");
    }

    function renderHeader() {
      const needsWorkspace = state.mode !== "demo" && !hasWorkspaceContext();
      const todayHeader = todayHeaderParts(needsWorkspace);
      const assistantHeader = assistantHeaderParts(needsWorkspace);
      const titles = headerTitles(needsWorkspace, assistantHeader, todayHeader);
      const [kicker, title, sub] = titles[state.view];
      els.kicker.textContent = kicker;
      els.pageTitle.textContent = title;
      els.pageSub.textContent = sub;
      els.modeBtn.textContent = state.mode === "demo" ? "Demo mode" : "Your church";
      const detailToggle = document.getElementById("detailToggle");
      if (detailToggle) detailToggle.textContent = needsWorkspace ? "Setup" : ["assistant", "email", "calendar", "integrations"].includes(state.view) ? "Desk" : "Person detail";
      configureTopActions(needsWorkspace);
    }

    function headerTitles(needsWorkspace, assistantHeader, todayHeader) {
      if (needsWorkspace) {
        const setupCopy = "Create a private church workspace before Marge saves pastoral data, connects tools, or queues approvals.";
        return {
          assistant: assistantHeader,
          today: todayHeader,
          people: ["People", "Create a workspace first.", setupCopy],
          care: ["Care Board", "Create a workspace first.", setupCopy],
          visitors: ["Visitors", "Create a workspace first.", setupCopy],
          prayer: ["Prayer", "Create a workspace first.", setupCopy],
          email: ["Email", "Create a workspace first.", "Marge can draft and triage after she has a private workspace and secure connector setup."],
          calendar: ["Calendar", "Create a workspace first.", "Marge can suggest protected time after she learns your rhythm inside a private workspace."],
          integrations: ["Integrations", "Create a workspace first.", "Secure connector setup starts after Marge has a private church workspace for credentials and synced context."],
          agents: ["Agent Tools", "Create a workspace first.", "MCP-capable assistants should act through a scoped Marge workspace, not shared preview data."],
          plan: ["Plan", "Create a workspace first.", "Approvals belong inside a private workspace before Marge prepares drafts, setup steps, or writeback actions."]
        };
      }
      return {
        assistant: assistantHeader,
        today: todayHeader,
        people: ["People", "Congregation memory.", "Search members, add notes, and keep the relational history in one place."],
        care: ["Care Board", "Active pastoral care.", "Track hospital, crisis, grief, and follow-up needs without relying on memory."],
        visitors: ["Visitors", "No one visits unnoticed.", "Log visitors, draft warm follow-up, and mark each touch as handled."],
        prayer: ["Prayer", "Requests that need care.", "Keep public and private prayer needs visible until someone checks back in."],
        email: ["Email", "Marge's draft desk.", "Triage ministry email, prepare replies, and keep pastoral follow-up tied to people."],
        calendar: ["Calendar", "Time for ministry.", "Protect sermon work, prepare meetings, and let Marge propose visit blocks before anything is booked."],
        integrations: ["Integrations", "Use the tools churches already trust.", "Rock RMS, Planning Center, Breeze, Google, and Outlook can feed Marge without making Marge the ChMS. MCP stays under Agent Tools."],
        agents: ["Agent Tools", "AI clients can help too.", "Connect Marge to MCP-capable assistants without giving up pastoral safety."],
        plan: ["Plan", "Approval queue.", "Prepared work Marge will not send or write until the pastor approves it."]
      };
    }

    function configureTopActions(needsWorkspace) {
      const primary = document.getElementById("topPrimaryAction");
      const secondary = document.getElementById("topSecondaryAction");
      if (needsWorkspace) {
        configureButton(primary, { text: "Create workspace", action: "open-form", form: "account" });
        configureButton(secondary, { text: "Learn plan", prompt: "What will you learn about my ministry?" });
        return;
      }
      configureButton(primary, { text: "Add Care", action: "open-form", form: "care" });
      configureButton(secondary, { text: "Add Person", action: "open-form", form: "person" });
    }

    function configureButton(button, options) {
      if (!button) return;
      button.textContent = options.text || "";
      ["action", "form", "prompt", "member"].forEach(name => button.removeAttribute(`data-${name}`));
      if (options.action) button.dataset.action = options.action;
      if (options.form) button.dataset.form = options.form;
      if (options.prompt) button.dataset.prompt = options.prompt;
      if (options.member) button.dataset.member = options.member;
    }

    function assistantHeaderParts(needsWorkspace) {
      if (needsWorkspace) {
        return ["Good morning.", "Create your church workspace.", "Marge starts by learning your ministry context, then connects tools securely behind a private workspace."];
      }
      const profile = currentProfile();
      const setupSteps = state.desk?.setup_steps || [];
      const interviewQuestion = state.desk?.interview_question;
      const needsFirstRealContext = setupSteps.some(step => step.type === "data_seed");
      if (state.mode !== "demo" && !profile.onboarding_complete) {
        return [
          "Good morning.",
          `Let's learn ${currentChurchName()}.`,
          interviewQuestion?.question || "Answer the next ministry-context question before Marge starts operational work."
        ];
      }
      if (state.mode !== "demo" && needsFirstRealContext) {
        return ["Good morning.", "Add the first real ministry context.", "Marge will not call the desk clear until she has at least one real person, visitor, care case, or prayer request to watch."];
      }
      return ["Good morning.", "What should we handle today?", "Ask Marge to draft, schedule, remember, or pull the right church context before you act."];
    }

    function todayHeaderParts(needsWorkspace) {
      if (needsWorkspace) {
        return ["Good morning.", "Create a workspace first.", "Marge will sort real people after she has a private church workspace."];
      }
      const profile = currentProfile();
      const setupSteps = state.desk?.setup_steps || [];
      const needsFirstRealContext = setupSteps.some(step => step.type === "data_seed");
      if (state.mode !== "demo" && !profile.onboarding_complete) {
        return ["Good morning.", `Let's learn ${currentChurchName()}.`, "Answer the next ministry-context question before Marge turns this into a care list."];
      }
      if (state.mode !== "demo" && needsFirstRealContext) {
        return ["Good morning.", "Add the first real ministry context.", "Marge will not call the desk clear until she has at least one real person, visitor, care case, or prayer request to watch."];
      }
      return ["Good morning.", state.briefing?.greeting?.replace(/^Good morning,?\s*/i, "") || "Here are your people for today.", "Start here. Marge has sorted the people who should not slip through the cracks."];
    }

    function renderMain() {
      if (state.loading) {
        els.content.innerHTML = `<div class="empty">Marge is gathering the morning briefing.</div>`;
        return;
      }
      if (state.view === "assistant") renderAssistant();
      if (state.view === "today") renderToday();
      if (state.view === "people") renderPeople();
      if (state.view === "care") renderCare();
      if (state.view === "visitors") renderVisitors();
      if (state.view === "prayer") renderPrayer();
      if (state.view === "email") renderEmail();
      if (state.view === "calendar") renderCalendar();
      if (state.view === "integrations") renderIntegrations();
      if (state.view === "agents") renderAgents();
      if (state.view === "plan") renderPlan();
    }

    function renderAssistant() {
      const stats = getStats();
      const desk = state.desk || {};
      const profile = desk.profile || state.profile || {};
      const hasWorkspace = hasWorkspaceContext();
      const needsWorkspace = !hasWorkspace;
      const priorities = needsWorkspace ? [] : (desk.priorities || priorityItems());
      const items = priorities.slice(0, 4);
      const emailDrafts = needsWorkspace ? [] : (desk.email_drafts || []);
      const calendarBlocks = needsWorkspace ? [] : (desk.calendar_blocks || []);
      const setupSteps = hasWorkspace ? (desk.setup_steps || []) : [];
      const firstSetupStep = setupSteps[0] || null;
      const needsFirstRealContext = setupSteps.some(step => step.type === "data_seed");
      const topAction = needsWorkspace || needsFirstRealContext ? null : activeActions()[0];
      const interviewQuestion = hasWorkspace ? desk.interview_question : null;
      const operatingPlan = hasWorkspace ? (desk.operating_plan || []) : [];
      const connectedCount = verifiedToolCount(desk.integrations || []);
      const needsContext = needsWorkspace || !profile.onboarding_complete;
      const basePromptList = needsWorkspace
        ? ["What will you learn about my ministry?", "How do secure connections work?", "What happens after I create a workspace?"]
        : ((desk.suggested_prompts && desk.suggested_prompts.length) ? desk.suggested_prompts : liveFallbackPrompts(profile, setupSteps));
      const promptList = assistantPromptOptions(basePromptList, interviewQuestion, setupSteps, needsWorkspace);
      const greeting = needsWorkspace ? "Good morning. Let's make Marge fit your ministry." : (desk.greeting || state.briefing?.greeting || `Good morning, ${currentPastorName()}.`);
      const proactiveSummary = needsWorkspace
        ? "Create a church workspace first so Marge can learn your ministry context separately, connect tools securely, and keep approvals in front of you."
        : (desk.proactive_summary || "I have your care list, draft queue, calendar blocks, and connected church systems in view.");
      const conversationPrompt = interviewQuestion
        ? `Next question: ${interviewQuestion.question}`
        : firstSetupStep
          ? `Next setup: ${firstSetupStep.title}`
          : "Ask Marge for a briefing, draft, schedule proposal, or church-system lookup.";
      const composerPlaceholder = needsWorkspace
        ? "What will you learn about my ministry?"
        : interviewQuestion
          ? interviewQuestion.placeholder
          : firstSetupStep
            ? setupPrompt(firstSetupStep)
            : "Draft a visitor follow-up and suggest a visit block.";
      els.content.innerHTML = `
        <section class="assistant-board">
          <div class="brief-hero">
            <div class="brief-hero-top">
              <div class="avatar">M</div>
              <div>
                <h2>${escapeHtml(greeting)}</h2>
                <p class="meta-text">${escapeHtml(proactiveSummary)}</p>
              </div>
              <button class="btn primary" data-view="today">Open briefing</button>
            </div>
            <div class="stats" style="margin-bottom:0">
              ${assistantStatsHtml({ needsWorkspace, needsContext, firstSetupStep, profile, interviewQuestion, stats, emailDrafts, calendarBlocks, connectedCount })}
            </div>
            <div class="suggested-actions">
              ${promptList.slice(0, 4).map(promptChip).join("")}
            </div>
          </div>

          ${needsContext ? onboardingPanel(profile, needsWorkspace) : contextPanel(profile)}
          ${setupSteps.length ? setupPlanPanel(setupSteps) : ""}
          ${operatingPlan.length ? operatingPlanPanel(operatingPlan, interviewQuestion) : ""}

          <section class="assistant-split">
            <div class="panel">
              <div class="panel-head">
                <div>
                  <h2>Conversation</h2>
                  <p>${escapeHtml(conversationPrompt)}</p>
                </div>
                ${hasWorkspace && state.chat.length ? `<button class="btn secondary" data-action="clear-chat">Clear history</button>` : ""}
              </div>
              <div style="padding:18px">
                ${assistantConversationHtml()}
              </div>
            </div>
            <div class="assistant-mini">
              <div class="record-card">
                <h3>What Marge can handle</h3>
                <p class="meta-text">Draft ministry emails, suggest calendar blocks, log care, prepare visitor follow-up, and pull context from church systems when integrations are connected.</p>
              </div>
              <div class="record-card">
                <h3>Approval posture</h3>
                <p class="meta-text">${escapeHtml(profile.guardrails || "Marge drafts and queues. You approve before messages are sent or external systems are changed.")}</p>
              </div>
              <div class="record-card">
                <h3>Not a new ChMS</h3>
                <p class="meta-text">Rock RMS, Planning Center, Breeze, Google, and Outlook remain the systems of record. Marge is the assistant layer.</p>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <div>
                <h2>First Pass For Today</h2>
                <p>Marge's best guess at what should move next.</p>
              </div>
              <button class="btn secondary" data-action="open-detail">Desk</button>
            </div>
            <div style="padding:18px" class="work-list">
              ${firstSetupStep && needsFirstRealContext ? setupWorkRow(firstSetupStep) : ""}
              ${topAction ? workRow(`Review queued work: ${topAction.title}`, topAction.description || label(topAction.action_type), "Approvals", "plan") : ""}
              ${!topAction && firstSetupStep && !needsFirstRealContext ? setupWorkRow(firstSetupStep) : ""}
              ${emailDrafts.length ? workRow(`Review ${emailDrafts.length} ministry draft${emailDrafts.length === 1 ? "" : "s"}`, emailDrafts[0]?.detail || "Visitor, care, prayer, or absence replies are queued when the data calls for them.", "Email", "email") : ""}
              ${calendarBlocks.length && !needsFirstRealContext ? workRow(calendarBlocks[0]?.title || "Protect a ministry block", calendarBlocks[0]?.detail || calendarBlocks[0]?.subtitle || "Marge will propose care and prep blocks from your profile and current priorities.", "Calendar", "calendar") : ""}
              ${needsWorkspace ? `<div class="work-row"><div><strong>Create a church workspace</strong><div class="meta-text">Marge needs a private workspace before she learns ministry context, recommends connectors, or queues follow-up work.</div></div><button class="btn secondary" data-action="open-form" data-form="account">Create</button></div>` : ""}
              ${!needsWorkspace && needsContext && !firstSetupStep && !calendarBlocks.length ? workRow("Keep teaching Marge", interviewQuestion?.question || "Answer the next ministry-context question so Marge can prioritize without guessing.", "Teach Marge", "assistant") : ""}
              ${items.length ? items.map(item => workRow(`${item.title}: ${item.action || item.subtitle || "Review"}`, item.detail || item.subtitle || "", label(item.type), "today")).join("") : (needsContext || needsFirstRealContext) ? "" : workRow("No urgent care gaps", "The current briefing does not show overdue care, visitor, or prayer follow-up.", "Today", "today")}
            </div>
          </section>

          ${tellMargeHtml("Ask Marge", composerPlaceholder, promptList)}
        </section>
      `;
    }

    function assistantConversationHtml() {
      const profile = state.profile || {};
      const needsWorkspace = !hasWorkspaceContext();
      const missing = profile.missing_fields || [];
      const nextQuestion = (profile.questions || []).find(q => q.id === missing[0]);
      const interview = needsWorkspace ? null : state.desk?.interview_question;
      const plan = needsWorkspace ? [] : (state.desk?.operating_plan || []);
      let messages = state.chat.length ? state.chat.slice(-6) : [];
      if (!messages.length && needsWorkspace) {
        messages = [
          { who: "marge", text: "Good morning. Create a workspace first, then I can learn your ministry context and keep this church's care private." },
          { who: "marge", text: "After that I will ask about your church, church voice, follow-up burden, first priority, tools, voice, rhythm, and guardrails before recommending what to connect or queue." }
        ];
      } else if (!messages.length && interview) {
        messages = [
          { who: "marge", text: `First, ${interview.question}` },
          { who: "marge", text: `Why I am asking: ${interview.why}` }
        ];
      } else if (!messages.length && plan.length) {
        messages = [
          { who: "marge", text: `I have enough to start. My read on this ministry: ${plan.slice(0, 3).map(item => `${item.title}: ${item.detail}`).join("; ")}.` }
        ];
      } else if (!messages.length) {
        messages = [
          { who: "marge", text: "Good morning. I can help with care, email drafts, calendar planning, visitors, prayer, and church-system context today." }
        ];
      }
      if (messages.length && interview && !messages.some(m => (m.text || "").includes(interview.question))) {
        messages = [...messages, { who: "marge", text: `Next, ${interview.question}` }];
      }
      return `
        <div class="conversation">
          ${messages.map(m => `
            <div class="message ${m.who === "user" ? "user" : ""}">
              <div class="avatar small">${m.who === "user" ? escapeHtml(initials(currentPastorName())) : "M"}</div>
              <div class="message-body">${chatMessageBodyHtml(m)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function chatMessageBodyHtml(message) {
      return `
        <div>${escapeHtml(message.text)}</div>
        ${chatActionsHtml(message)}
        ${chatPromptsHtml(message)}
      `;
    }

    function chatActionsHtml(message) {
      const actions = (message.actions || []).filter(Boolean).slice(0, 4);
      if (!actions.length) return "";
      return `<div class="message-action-list">${actions.map(chatActionCardHtml).join("")}</div>`;
    }

    function chatActionCardHtml(item) {
      const button = chatActionButtonHtml(item);
      return `
        <div class="message-action-card">
          <div>
            <strong>${escapeHtml(item.title || "Review item")}</strong>
            <div class="meta-text">${escapeHtml(item.subtitle || item.detail || item.action || "Marge prepared this for review.")}</div>
          </div>
          ${button}
        </div>
      `;
    }

    function chatActionButtonHtml(item) {
      if (["profile", "seed", "integrations"].includes(item.source || "")) return setupStepButton(item);
      const actionId = chatActionId(item);
      if (actionId) return `<button class="btn secondary" data-action="action-open" data-action-id="${escapeHtml(actionId)}">Open</button>`;
      const target = chatActionView(item);
      if (target) return `<button class="btn secondary" data-view="${target.view}">${escapeHtml(target.label)}</button>`;
      if (item.form) return `<button class="btn secondary" data-action="open-form" data-form="${escapeHtml(seedForm(item))}">${escapeHtml(item.action || "Open")}</button>`;
      return `<button class="btn secondary" data-view="plan">Review</button>`;
    }

    function chatActionId(item) {
      const id = String(item.id || "");
      return id.startsWith("action-") ? id.slice("action-".length) : "";
    }

    function chatActionView(item) {
      const source = String(item.source || "").toLowerCase();
      const type = String(item.type || "").toLowerCase();
      if (source.includes("visitor") || type === "visitor") return { view: "visitors", label: "Open visitors" };
      if (source.includes("prayer") || type === "prayer") return { view: "prayer", label: "Open prayer" };
      if (source.includes("care") || type === "care") return { view: "care", label: "Open care" };
      if (source.includes("member") || type === "member" || type === "member_note") return { view: "people", label: "Open people" };
      if (type.includes("email")) return { view: "email", label: "Open email" };
      if (type.includes("calendar") || type.includes("meeting")) return { view: "calendar", label: "Open calendar" };
      if (type.includes("synced") || type.includes("context")) return { view: "integrations", label: "Open context" };
      if (source.includes("integration") || item.provider) return { view: "integrations", label: "Open setup" };
      return null;
    }

    function chatPromptsHtml(message) {
      const prompts = uniquePrompts((message.prompts || []).map(prompt => ({ label: shortPrompt(prompt), prompt }))).slice(0, 3);
      if (!prompts.length) return "";
      return `<div class="message-actions">${prompts.map(promptChip).join("")}</div>`;
    }

    function workRow(title, text, labelText, view) {
      return `
        <div class="work-row">
          <div>
            <strong>${escapeHtml(title)}</strong>
            <div class="meta-text">${escapeHtml(text)}</div>
          </div>
          <button class="btn secondary" data-view="${view}">${escapeHtml(labelText)}</button>
        </div>
      `;
    }

    function setupWorkRow(step) {
      return `
        <div class="work-row">
          <div>
            <strong>${escapeHtml(step.title)}</strong>
            <div class="meta-text">${escapeHtml(step.subtitle || step.detail || "Next setup step.")}</div>
          </div>
          ${setupStepButton(step)}
        </div>
      `;
    }

    function assistantPromptOptions(basePrompts = [], interviewQuestion = null, setupSteps = [], needsWorkspace = false) {
      const prompts = [];
      if (needsWorkspace) {
        prompts.push(
          { label: "Learn plan", prompt: "What will you learn about my ministry?" },
          { label: "Secure tools", prompt: "How do secure connections work?" },
          { label: "After signup", prompt: "What happens after I create a workspace?" }
        );
      } else if (interviewQuestion) {
        const answer = onboardingAnswerExample(interviewQuestion);
        if (answer) prompts.push({ label: `Answer ${interviewQuestion.label.toLowerCase()}`, prompt: answer });
        prompts.push({ label: "Why this?", prompt: "What do you still need to learn about my ministry?" });
      } else if (setupSteps[0]) {
        prompts.push({ label: shortPrompt(setupPrompt(setupSteps[0])), prompt: setupPrompt(setupSteps[0]) });
      }
      basePrompts.forEach(prompt => prompts.push(typeof prompt === "string" ? { label: shortPrompt(prompt), prompt } : prompt));
      return uniquePrompts(prompts);
    }

    function liveFallbackPrompts(profile = currentProfile(), setupSteps = []) {
      if (!hasWorkspaceContext()) {
        return ["What will you learn about my ministry?", "How do secure connections work?", "What happens after I create a workspace?"];
      }
      if (!profile.onboarding_complete) {
        return ["What do you still need to learn about my ministry?", "How will you use this context?", "How do secure connections work?"];
      }
      if (setupSteps[0]) {
        return [setupPrompt(setupSteps[0]), "Why is this the next step?", "Explain the approval rules."];
      }
      const prompts = [];
      if (profile.ministry_priorities) prompts.push(`What should I do for ${shortContext(profile.ministry_priorities)}?`);
      if (activeActions().length) prompts.push("What should I review first?");
      if (verifiedToolCount() > 0) prompts.push("Show connected context.");
      prompts.push("Help me add a ministry update.", "Explain the approval rules.");
      return uniquePrompts(prompts).slice(0, 3).map(item => typeof item === "string" ? item : item.prompt);
    }

    function shortContext(value) {
      const text = String(value || "").trim().replace(/\s+/g, " ");
      return text.length > 72 ? `${text.slice(0, 69)}...` : text;
    }

    function onboardingAnswerExample(question) {
      const examples = {
        pastor_name: "Call me Pastor Nathan.",
        church_name: "I serve at Grace Community Church.",
        role_title: "I am a solo pastor and we average about 85 people each week.",
        congregation_size: "We average about 85 people each week.",
        church_context: "We are a small neighborhood church with a lot of new families and tired volunteers.",
        faith_tradition: "Our church tradition is non-denominational with Baptist roots; avoid insider language with guests.",
        followup_pain: "Visitor follow-up after Sunday is where things slip through the cracks.",
        ministry_priorities: "My first priority this month is closing loops with first-time guests and private prayer needs.",
        tools_in_use: "We use Planning Center and Gmail.",
        communication_style: "Please write in a warm and brief voice.",
        weekly_rhythm: "Protect sermon prep on Thursday mornings and hospital visits on Tuesday afternoons.",
        guardrails: "Do not send emails or write to external systems without my approval."
      };
      return examples[question.field] || "";
    }

    function setupPrompt(step) {
      if (step.type === "data_seed") {
        if (step.form === "visitor") return "Help me log the first real visitor.";
        if (step.form === "prayer") return "Help me add the first prayer request.";
        if (/care|hospital|grief|crisis/i.test(`${step.title || ""} ${step.action || ""}`)) return "Help me open the first care case.";
        return "Help me add the first real person.";
      }
      if (step.type === "integration_setup") return `Help me with ${step.title}.`;
      return `Help me with ${step.title}.`;
    }

    function uniquePrompts(prompts) {
      const seen = new Set();
      return prompts.filter(item => {
        const prompt = typeof item === "string" ? item : item.prompt;
        if (!prompt || seen.has(prompt)) return false;
        seen.add(prompt);
        return true;
      });
    }

    function promptChip(item) {
      const prompt = typeof item === "string" ? item : item.prompt;
      const labelText = typeof item === "string" ? shortPrompt(item) : (item.label || shortPrompt(item.prompt));
      return `<button class="chip" data-prompt="${escapeHtml(prompt)}">${escapeHtml(labelText)}</button>`;
    }

    function shortPrompt(prompt) {
      if (prompt.toLowerCase().includes("learn")) return "Teach Marge";
      if (prompt.toLowerCase().includes("attention")) return "Before noon";
      if (prompt.toLowerCase().includes("draft")) return "Draft replies";
      if (prompt.toLowerCase().includes("fit") || prompt.toLowerCase().includes("calendar")) return "Plan time";
      return prompt.length > 24 ? `${prompt.slice(0, 21)}...` : prompt;
    }

      if (needsContext) {

        return [
          stat("Profile learned", completion, "Marge is becoming specific to this pastor and church."),
          stat("Next question", "1", next),
          stat("Secure tools", connectedCount || "0", connectedCount ? "Verified church tools are ready for sync." : "No church tool has passed a credential check yet."),
          stat("Approval guardrail", "On", profile.guardrails || "Marge will not send or write externally without approval."),
        ].join("");

          stat("Approval guardrail", "On", profile.guardrails || "Marge will not send or write externally without approval."),

      }
      return [
        stat("Need attention", stats.attention, "Care, absence, visitors, and prayer."),
        stat("Drafts queued", emailDrafts.length, "Email and pastoral replies waiting for review."),

    async function disconnectIntegration(provider) {
      const displayName = providerDisplayName(provider);
      const ok = window.confirm(`Disconnect ${displayName} for this Marge user? Marge will remove the encrypted OAuth token and stop syncing through this user's consent.`);
      if (!ok) return;
      try {
        const result = await api(`/assistant/integrations/${provider}`, { method: "DELETE" });
        toast(result.message || `${displayName} disconnected.`);

      }

    function verificationIdentityHtml(identity) {
      const entries = Object.entries(identity || {}).filter(([, value]) => value !== null && value !== undefined && value !== "");
      if (!entries.length) return "";
      return entries.slice(0, 8).map(([key, value]) => `
        <div class="detail-item"><div class="tiny">${escapeHtml(label(key))}</div>${escapeHtml(String(value))}</div>
      `).join("");
    }

    function errorMessage(error, fallback) {
      const raw = String(error?.body || error?.message || "");
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed.detail === "string") return parsed.detail;
        if (Array.isArray(parsed.detail)) {
          const messages = parsed.detail
            .map(item => item?.msg || item?.message || "")
            .filter(Boolean);
          if (messages.length) return messages.slice(0, 2).join(" ");
        }
      } catch {}
      return fallback;
    }

    function submitErrorFallback(type) {
      if (type === "integration-credential") return "Connector credentials were not saved. Check encrypted storage, provider URL, and your workspace role.";
      if (type === "account") return "Marge could not create that workspace. Check the required fields and try again.";
      if (type === "profile") return "Marge could not save the ministry profile. Check your workspace role and try again.";
      if (["person", "visitor", "care", "prayer", "note"].includes(type)) return "That ministry record was not saved. Check the fields and your workspace role.";
      return "That did not save. Check the fields and try again.";
    }

    function writebackAllowedActions(provider) {

    function writebackActionLabel(action) {

    function writebackSummary(item, policy) {
      const allowed = writebackAllowedActions(item.provider);
      if (!allowed.length) return "Writeback: not supported for this connector";
      const policyActions = Array.isArray(policy.allowed_actions) && policy.allowed_actions.length ? policy.allowed_actions : allowed;
      const scopeText = policyActions.map(writebackActionLabel).join(", ");
      return `Writeback: ${policy.write_enabled ? "enabled after approval" : "off by church policy"} for ${scopeText}`;
    }

    function writebackToggleLabel(provider, enabled) {
      if (enabled) return "Disable writeback";
      if (provider === "microsoft_365") return "Enable Outlook drafts/calendar";
