      if (provider === "microsoft_365") return "Outlook draft writeback";
      if (provider === "google_workspace") return "Google writeback";
      return "Writeback";
    }

    async function togglePolicy(provider, enabled) {
      try {
        const allowedActions = writebackAllowedActions(provider);
        await api(`/assistant/policies/${provider}`, {
          method: "PATCH",
          body: JSON.stringify({ write_enabled: enabled, require_approval: true, allowed_actions: allowedActions })
        });
        toast(enabled ? `${writebackToastLabel(provider)} enabled after approval.` : `${writebackToastLabel(provider)} disabled.`);
        await loadData();
      } catch (error) {
        console.error(error);
        toast("Marge could not update that connector policy.");
      }
    }

    function renderDetail() {
      if (["assistant", "email", "calendar", "integrations"].includes(state.view)) {

      if (!selected) {
        els.detail.innerHTML = `
          <div class="detail-card">

      const member = state.mode === "live" ? state.selectedDetail : state.members.find(m => m.id === selected.id);

            <button class="btn primary" data-action="copy-suggested">Copy</button>

          <p class="meta-text">Live drafts are prepared from workspace records through Marge's draft service, not from browser-only templates.</p>

            <button class="btn secondary" data-action="draft" data-item='${escapeHtml(JSON.stringify(detailDraftItem))}'>Draft message</button>

          <div class="detail-list">
            ${notes.length ? notes.slice(0, 5).map(n => `<div class="detail-item"><div class="tiny">${formatDate(n.created_at)}${n.context_tag ? ` - ${escapeHtml(label(n.context_tag))}` : ""}</div>${escapeHtml(n.note_text)}</div>`).join("") : `<div class="detail-item">No notes yet.</div>`}

          <h3>Care And Prayer</h3>
          <div class="detail-list">

    function localDraft(item) {
      const first = (item.name || "friend").split(" ")[0];
      const pastor = currentPastorName();
      const church = currentChurchName();
      if (item.type === "birthday") return `Hey ${first}, happy birthday. I am grateful for you and hope today is full of good things.\n\n- ${pastor}`;
      if (item.type === "anniversary") return `Hey ${first}, happy anniversary. Thankful for you both and praying for your marriage today.\n\n- ${pastor}`;
      if (item.type === "visitor") return `Hey ${first}, this is ${pastor} from ${church}. I am really glad you joined us recently. I would love to grab coffee sometime if you are open to it.\n\n- ${pastor}`;
      if (item.type === "prayer") return `Hey ${first}, just wanted to check in on what you asked us to pray about. I am still praying for you. How are things going?\n\n- ${pastor}`;
      if (item.type === "absence") return `Hey ${first}, you have been on my mind and I wanted to check in. Hope you are doing well. If you need anything, I would love to help.\n\n- ${pastor}`;
      return `Hey ${first}, just thinking about you today and wanted to check in. How are you doing?\n\n- ${pastor}`;
    }

    async function draftFor(item) {
      if (state.mode === "demo") {
        showDraft(localDraft(item), item.name || "Draft");
        return;
      }
      let body;
      if (item.type === "visitor") body = { kind: "visitor", visitor_id: item.id, day: 1 };
      else if (item.type === "prayer") body = { kind: "prayer", prayer_id: item.id, context: item.reason };
      else body = { kind: item.draftKind || item.type || "general", member_id: item.member_id, care_id: item.type === "care" ? item.id : undefined, situation: item.situation || item.reason || "general" };
      try {
        const result = await api("/drafts/", { method: "POST", body: JSON.stringify(body) });
        showDraft(result.draft, result.recipient_name);
      } catch (error) {
        console.error(error);
        toast("Marge could not prepare that draft from the workspace record.");
      }
    }

    function showDraft(text, title) {
      els.modalContent.innerHTML = `
        <h2 id="modalTitle">Draft for ${escapeHtml(title)}</h2>
        <p class="muted">Edit before sending. Marge drafts; the pastor sends.</p>
        <div class="form-grid">
          <label class="form-full">Message<textarea id="draftText">${escapeHtml(text)}</textarea></label>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" data-action="close-modal">Close</button>
          <button class="btn primary" data-action="copy-draft">Copy</button>
        </div>
      `;
      openModal();
    }

    function openModal() {
      els.modal.classList.add("open");
      els.modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      els.modal.classList.remove("open");
      els.modal.setAttribute("aria-hidden", "true");
      els.modalContent.innerHTML = "";
    }

      return `<option value="">Choose a member</option>${state.members.map(m => `<option value="${m.id}" ${String(selectedId) === String(m.id) ? "selected" : ""}>${escapeHtml(m.full_name)}</option>`).join("")}`;

        openModal();

      const forms = {
        account: accountForm,
        person: personForm,
        care: careForm,
        visitor: visitorForm,
        prayer: prayerForm,
        note: noteForm,
        profile: profileForm
      };
      els.modalContent.innerHTML = forms[form](memberId);
      openModal();
    }

    function requiresWorkspaceForForm(form) {
      const writeForms = ["person", "care", "visitor", "prayer", "note"];
      return state.mode !== "demo" && writeForms.includes(form) && !hasWorkspaceContext();
    }

    function formData(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      Object.keys(data).forEach(key => {
        if (data[key] === "") data[key] = null;
      });
      return data;
    }

    async function handleSubmit(form) {
      const type = form.dataset.submit;
      if (state.mode === "demo" && !["profile", "account", "login-link"].includes(type)) {
        closeModal();
        toast("Demo mode previewed that action. Switch to your church workspace to save.");
        return;
      }
      const data = formData(form);
      try {
        if (type === "login-link") {
          await api("/assistant/login-links/request", { method: "POST", body: JSON.stringify(data) });
          toast("If that email has access, Marge sent a sign-in link.");
          return;
        }
        if (type === "account") {
          const result = await api("/assistant/signup", { method: "POST", body: JSON.stringify(data) });
          state.accountToken = result.token;
          try {
            await establishBrowserSession();
          } catch (sessionError) {
            console.error(sessionError);
            toast("Workspace created, but Marge could not set a browser session. Keep this page open and try again.");
          }
          state.authRequired = false;
          state.profile = result.profile;
          state.mode = "live";
          state.selected = null;
          state.selectedDetail = null;
          setQueryMode();
        }
        if (type === "integration-credential") {
          const provider = data.provider;
          delete data.provider;
          await api(`/assistant/integrations/${provider}/credentials`, { method: "POST", body: JSON.stringify(data) });
        }
        if (type === "profile") await api("/assistant/profile", { method: "PATCH", body: JSON.stringify(data) });
        if (type === "person") await api("/members/", { method: "POST", body: JSON.stringify(data) });
        if (type === "care") await api("/care/", { method: "POST", body: JSON.stringify({ ...data, member_id: Number(data.member_id) }) });
        if (type === "visitor") await api("/visitors/", { method: "POST", body: JSON.stringify(data) });
        if (type === "prayer") await api("/care/prayers/", { method: "POST", body: JSON.stringify({ ...data, member_id: data.member_id ? Number(data.member_id) : null, is_private: data.is_private === "true" }) });
        if (type === "note") await api(`/members/${data.member_id}/notes`, { method: "POST", body: JSON.stringify({ note_text: data.note_text, context_tag: data.context_tag }) });
        closeModal();
        toast(type === "account" ? "Workspace created. Marge will remember this church on this device." : type === "profile" ? "Saved. Marge knows your ministry better now." : type === "integration-credential" ? "Connector credentials saved encrypted. Check them before syncing." : "Saved. Marge will keep it in view.");
        await loadData();
      } catch (error) {
        console.error(error);
        toast(errorMessage(error, submitErrorFallback(type)));
      }
    }

    async function markDone(item) {
      if (state.mode === "demo") {
        toast("Demo mode marked that as handled for this preview.");
        if (item.type === "care") {
          state.care = state.care.filter(c => c.id !== item.id);
          if (state.briefing) state.briefing.active_care_cases = (state.briefing.active_care_cases || []).filter(c => c.id !== item.id);
        }
        if (item.type === "visitor") {
          state.visitors = state.visitors.filter(v => v.id !== item.id);
          if (state.briefing) state.briefing.visitors_needing_followup = (state.briefing.visitors_needing_followup || []).filter(v => v.id !== item.id);
        }
        if (item.type === "prayer") {
          state.prayers = state.prayers.filter(p => p.id !== item.id);
          if (state.briefing) state.briefing.unanswered_prayers = (state.briefing.unanswered_prayers || []).filter(p => p.id !== item.id);
        }
        render();
        return;
      }
      try {
        if (item.type === "care") await api(`/care/${item.id}/contact`, { method: "POST", body: JSON.stringify({ note: "Contacted via Marge workspace" }) });
        if (item.type === "visitor") await api(`/visitors/${item.id}`, { method: "PATCH", body: JSON.stringify({ follow_up_day1_sent: true }) });
        if (item.type === "prayer") await api(`/care/prayers/${item.id}`, { method: "PATCH", body: JSON.stringify({ status: "answered" }) });
        toast("Done. Marge updated the record.");
        await loadData();
      } catch (error) {
        console.error(error);
        toast("Marge could not save that action.");
      }
    }

    async function prepareActions() {
      if (state.mode !== "demo" && !hasWorkspaceContext()) {
        openForm("account");
        return;
      }
      if (state.mode !== "demo" && !currentProfile().onboarding_complete) {
        state.view = "assistant";
        render();
        toast("Answer the next ministry-context question before preparing approvals.");
        return;
      }
      try {
        const prepared = await api(`/assistant/actions/prepare?mode=${state.mode}`, { method: "POST", body: "{}" });
        state.actions = prepared;
        toast(prepared.length ? `Prepared ${prepared.length} approval item${prepared.length === 1 ? "" : "s"}.` : "No approval items needed right now.");
        await loadData();
      } catch (error) {
        console.error(error);
        toast("Marge could not prepare the approval queue.");
      }
    }

    async function queueDraftApproval(draft) {
      if (state.mode === "demo") {
        toast("Demo mode previewed the approval queue. Switch to your church workspace to queue it.");
        return;
      }
      const existing = draftApprovalAction(draft);
      if (existing) {
        state.view = "plan";
        render();
        await openAssistantAction(existing.id);
        return;
      }
      try {
        await api(`/assistant/actions/prepare?mode=${state.mode}&email_limit=20`, { method: "POST", body: "{}" });
        await loadData();
        const action = draftApprovalAction(draft);
        if (action) {
          state.view = "plan";
          render();
          await openAssistantAction(action.id);
          toast("Draft queued for pastor approval.");
        } else {
          toast("Marge prepared the queue, but could not match that draft. Open Plan to review prepared work.");
        }
      } catch (error) {
        console.error(error);
        toast("Marge could not queue that draft for approval.");
      }
    }

    async function queueCalendarBlockApproval(block) {
      if (state.mode === "demo") {
        toast("Demo mode previewed the calendar approval queue. Switch to your church workspace to queue it.");
        return;
      }
      const existing = calendarBlockAction(block);
      if (existing) {
        state.view = "plan";
        render();
        await openAssistantAction(existing.id);
        return;
      }
      const body = {
        action_type: "calendar_block",
        title: block.title || "Review calendar block",
        description: block.detail || block.subtitle || block.action || "Review the proposed ministry time before changing any calendar.",
        payload: {
          desk_item: block,
        },
        source: "calendar",
        related_type: block.type || "calendar_block",
        related_id: block.related_id || null,
        privacy_level: "pastoral",
      };
      try {
        const action = await api("/assistant/actions", { method: "POST", body: JSON.stringify(body) });
        state.view = "plan";
        await loadData();
        await openAssistantAction(action.id);
        toast("Calendar block queued for pastor approval.");
      } catch (error) {
        console.error(error);
        toast("Marge could not queue that calendar block.");
      }
    }

    async function updateAssistantAction(actionId, verb) {
      try {
        const result = await api(`/assistant/actions/${actionId}/${verb}`, { method: "POST", body: "{}" });
        toast(actionUpdateMessage(result, verb));
        await loadData();
        if (els.modal.classList.contains("open")) await openAssistantAction(actionId);
        return result;
      } catch (error) {
        console.error(error);
        toast("Marge could not update that approval item.");
      }
    }

    function actionUpdateMessage(action, verb) {
      if (verb === "approve") return "Approved. Marge will still wait before any external write.";
      if (verb === "skip") return "Skipped.";
      const execution = action?.payload?.execution || {};
      if (execution.kind === "gmail_draft") return "Gmail draft created. It was not sent.";
      if (execution.kind === "outlook_draft") return "Outlook draft created. It was not sent.";
      if (execution.kind === "calendar_event") return "Google Calendar event created.";
      if (execution.kind === "outlook_calendar_event") return "Outlook calendar event created.";
      if (execution.kind === "email_reply_drafted") return "Reply draft prepared for review.";
      if (execution.kind === "local_member_upsert") return `${execution.created ? "Created" : "Updated"} local Marge person memory.`;
      if (action?.action_type === "calendar_block") return "Calendar block marked reviewed.";
      return "Marked done.";
    }

    async function openAssistantAction(actionId) {
      let action = (state.actions || []).find(item => String(item.id) === String(actionId));
      if (!action) {
        try {
          action = await api(`/assistant/actions/${actionId}`);
          state.actions = [action, ...(state.actions || []).filter(item => String(item.id) !== String(actionId))];
        } catch (error) {
          console.error(error);
          return toast("That approval item is no longer available.");
        }
      }
      const email = action.payload?.email;
      const isEmailDraft = Boolean(email?.body || email?.to);
      const calendarEvent = action.payload?.calendar_event;
      const deskItem = action.payload?.desk_item;
      const brief = action.payload?.brief;
      const integrationSetup = action.payload?.integration_setup;
      const setupStep = action.payload?.setup_step || setupStepFromIntegrationSetup(integrationSetup);
      const execution = action.payload?.execution;
      const person = action.payload?.person;
      const plan = action.payload?.plan || [];
      const setupCta = setupStepActionButton(setupStep);
      els.modalContent.innerHTML = `
        <h2 id="modalTitle">${escapeHtml(action.title)}</h2>
        <p class="muted">${escapeHtml(action.description || label(action.action_type))}</p>
        <div class="detail-list" style="margin-top:14px">
          <div class="detail-item"><div class="tiny">Status</div>${escapeHtml(label(action.status))}</div>
          ${email && isEmailDraft ? `<div class="detail-item"><div class="tiny">To</div>${escapeHtml(email.to || "Recipient needed")}</div><div class="detail-item"><div class="tiny">Subject</div>${escapeHtml(email.subject || "")}</div><div class="detail-item"><div class="tiny">Draft</div><pre class="suggested">${escapeHtml(email.body || "")}</pre></div>` : ""}
          ${email && !isEmailDraft ? `<div class="detail-item"><div class="tiny">Synced email</div><strong>${escapeHtml(email.subject || action.title)}</strong><div class="meta-text">${escapeHtml(email.from || "Sender not listed")}</div><div class="meta-text">${escapeHtml(email.snippet || "No preview synced.")}</div></div>` : ""}
          ${deskItem && !email && !brief && !calendarEvent ? `<div class="detail-item"><div class="tiny">Recommendation</div><strong>${escapeHtml(deskItem.title || action.title)}</strong><div class="meta-text">${escapeHtml(deskItem.detail || deskItem.subtitle || deskItem.action || action.description || "")}</div></div>` : ""}
          ${brief ? `<div class="detail-item"><div class="tiny">Meeting brief</div><pre class="suggested">${escapeHtml(brief)}</pre></div>` : ""}
          ${calendarEvent && !brief ? `<div class="detail-item"><div class="tiny">Calendar event</div>${escapeHtml(calendarEvent.summary || calendarEvent.subject || calendarEvent.name || calendarEvent.title || "Calendar event")}</div>` : ""}
          ${person ? `<div class="detail-item"><div class="tiny">Synced person</div><strong>${escapeHtml(person.name || [person.first_name, person.last_name].filter(Boolean).join(" ") || "Person")}</strong><div class="meta-text">${escapeHtml([person.status || person.membership, person.email, person.phone].filter(Boolean).join(" - ") || "Review before adding to local memory.")}</div></div>` : ""}
          ${setupStep ? `<div class="detail-item"><div class="tiny">Setup step</div><strong>${escapeHtml(setupStep.title || action.title)}</strong><div class="meta-text">${escapeHtml(setupStep.subtitle || setupStep.detail || "")}</div></div>` : ""}
          ${integrationSetup ? `<div class="detail-item"><div class="tiny">Connector</div><strong>${escapeHtml(integrationSetup.display_name || label(integrationSetup.provider || "integration"))}</strong><div class="meta-text">${escapeHtml(label(integrationSetup.status || "setup"))} - ${escapeHtml(label(integrationSetup.setup_type || "connector"))}</div></div>` : ""}
          ${integrationSetup?.missing_config?.length ? `<div class="detail-item"><div class="tiny">Server config needed</div>${integrationSetup.missing_config.map(escapeHtml).join(", ")}</div>` : ""}
          ${integrationSetup?.authorization_url ? `<div class="detail-item"><div class="tiny">Secure authorization</div><a href="${escapeHtml(integrationSetup.authorization_url)}" target="_blank" rel="noreferrer">Open provider authorization</a></div>` : ""}
          ${integrationSetup?.instructions?.length ? `<div class="detail-item"><div class="tiny">Instructions</div><div class="work-list">${integrationSetup.instructions.map(text => `<div class="work-row"><div class="meta-text">${escapeHtml(text)}</div></div>`).join("")}</div></div>` : ""}
          ${plan.length ? `<div class="detail-item"><div class="tiny">First-week plan</div><div class="work-list">${plan.map(step => `<div class="work-row"><div><strong>${escapeHtml(step.title || "Plan step")}</strong><div class="meta-text">${escapeHtml(step.why || "")}</div><div class="tiny">${escapeHtml(step.guardrail || "")}</div></div></div>`).join("")}</div></div>` : ""}
          ${executionSummaryHtml(execution)}
          <div class="detail-item"><div class="tiny">Guardrail</div>${escapeHtml(actionGuardrailText(action))}</div>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" data-action="close-modal">Close</button>
          ${setupCta || ""}
          ${actionPrimaryButton(action, setupCta)}
          ${["pending", "approved"].includes(action.status) ? `<button class="btn secondary" data-action="action-skip" data-action-id="${action.id}">Skip</button>` : ""}
        </div>
      `;
      openModal();
    }

    function executionSummaryHtml(execution) {
      if (!execution?.kind) return "";
      if (execution.kind === "local_member_upsert") {
        return `<div class="detail-item"><div class="tiny">Execution</div>${escapeHtml(execution.created ? "Created local person" : "Updated local person")}: ${escapeHtml(execution.member_name || "Member")}</div>`;
      }
      if (execution.kind === "email_reply_drafted") {
        return `<div class="detail-item"><div class="tiny">Execution</div>Prepared reply draft: ${escapeHtml(execution.draft_title || "Draft reply")}</div>`;
      }
      if (execution.kind === "gmail_draft") {
        return `<div class="detail-item"><div class="tiny">Execution</div>Created Gmail draft${execution.provider_id ? `: ${escapeHtml(execution.provider_id)}` : ""}. It was not sent.</div>`;
      }
      if (execution.kind === "outlook_draft") {
        const link = execution.web_link ? ` <a href="${escapeHtml(execution.web_link)}" target="_blank" rel="noreferrer">Open in Outlook</a>` : "";
        return `<div class="detail-item"><div class="tiny">Execution</div>Created Outlook draft${execution.provider_id ? `: ${escapeHtml(execution.provider_id)}` : ""}. It was not sent.${link}</div>`;
      }
      if (execution.kind === "calendar_event") {
        const link = execution.html_link ? ` <a href="${escapeHtml(execution.html_link)}" target="_blank" rel="noreferrer">Open event</a>` : "";
        return `<div class="detail-item"><div class="tiny">Execution</div>Created Google Calendar event${execution.provider_id ? `: ${escapeHtml(execution.provider_id)}` : ""}.${link}</div>`;
      }
      if (execution.kind === "outlook_calendar_event") {
        const link = execution.web_link ? ` <a href="${escapeHtml(execution.web_link)}" target="_blank" rel="noreferrer">Open in Outlook</a>` : "";
        return `<div class="detail-item"><div class="tiny">Execution</div>Created Outlook calendar event${execution.provider_id ? `: ${escapeHtml(execution.provider_id)}` : ""}.${link}</div>`;
      }
      return `<div class="detail-item"><div class="tiny">Execution</div>${escapeHtml(label(execution.kind))}</div>`;
    }

    function setupStepActionButton(step) {
      if (!step) return "";
      const labelText = step.action || "Open";
      if (step.source === "profile") return `<button class="btn primary" data-action="open-form" data-form="profile">${escapeHtml(labelText)}</button>`;
      if (step.source === "seed") return `<button class="btn primary" data-action="open-form" data-form="${escapeHtml(seedForm(step))}">${escapeHtml(labelText)}</button>`;
      if (step.source === "integrations" && step.provider) return `<button class="btn primary" data-action="${setupIntegrationAction(step)}" data-provider="${escapeHtml(step.provider)}">${escapeHtml(labelText)}</button>`;
      return "";
    }

    function setupStepFromIntegrationSetup(setup) {
      if (!setup?.provider) return null;
      const action = setup.authorization_url ? "Start secure setup" : (setup.missing_config?.length ? "Review server config" : "Open setup");
      return {
        type: "integration_setup",
        title: `Connect ${setup.display_name || label(setup.provider)}`,
        subtitle: setup.instructions?.[0] || setup.secure_note || "",
        detail: setup.secure_note || "",
        action,
        source: "integrations",
        provider: setup.provider,
      };
    }

    async function sendTell() {
      const input = document.getElementById("tellInput");
      const message = input?.value.trim();
      if (!message) return;
      state.chat.push({ who: "user", text: message });
      input.value = "";
      renderMain();
      if (state.view === "assistant" && needsWorkspaceForChat()) {
        state.chat.push({ who: "marge", text: preWorkspaceReply(message) });
        renderMain();
        return;
      }
      try {
        const result = await api("/assistant/chat", { method: "POST", body: JSON.stringify({ message, mode: state.mode }) });
        const enhancement = chatEnhancement(result);
        if ((result.saved && state.mode === "live") || state.view === "assistant") {
          await loadData();
          attachChatEnhancement(result.reply, enhancement);
          renderMain();
        } else {
          state.chat.push({ who: "marge", text: result.reply, ...enhancement });
          renderMain();
        }
      } catch (error) {
        console.error(error);
        state.chat.push({ who: "marge", text: "I heard you, but I had trouble saving that. Try once more in a moment." });
        renderMain();
      }
    }

    function chatEnhancement(result) {
      return {
        intent: result.intent || "",
        saved: Boolean(result.saved),
        actions: result.actions || [],
        prompts: result.suggested_prompts || []
      };
    }

    function attachChatEnhancement(reply, enhancement) {
      const hasEnhancement = (enhancement.actions || []).length || (enhancement.prompts || []).length;
      if (!hasEnhancement) return;
      for (let index = state.chat.length - 1; index >= 0; index -= 1) {
        const message = state.chat[index];
        if (message.who === "marge" && message.text === reply) {
          state.chat[index] = { ...message, ...enhancement };
          return;
        }
      }
      state.chat.push({ who: "marge", text: reply, ...enhancement });
    }

    async function clearChatHistory() {
      if (state.mode === "demo") {
        state.chat = [];
        renderMain();
        return;
      }
      if (!confirm("Clear this workspace's assistant chat history? Saved profile, people, prayer, care, and approval work will stay.")) return;
      try {
        const result = await api("/assistant/chat/history", { method: "DELETE" });
        state.chat = [];
        toast(result.message || "Assistant chat history cleared.");
        await loadData();
      } catch (error) {
        console.error(error);
        toast("Marge could not clear that history. Try again in a moment.");
      }
    }

    function needsWorkspaceForChat() {
      return !hasWorkspaceContext();
    }

    function preWorkspaceReply(message) {
      const lower = message.toLowerCase();
      if (lower.includes("secure") || lower.includes("connection") || lower.includes("connect")) {
        return "Secure setup happens after the workspace exists. Marge uses provider authorization, encrypted API-key setup, or server-side secrets, keeps credentials encrypted on the server, and queues any external write for your review before anything is sent or changed.";
      }
      if (lower.includes("after") || lower.includes("signup") || lower.includes("workspace")) {
        return "After you create a workspace, I will ask the missing ministry-context questions, recommend the tools to connect from what you already use, and prepare only reviewable setup or follow-up work.";
      }
      if (lower.includes("learn") || lower.includes("ministry") || lower.includes("context")) {
        return "I will learn your role, church context, follow-up burden, tools, drafting voice, weekly rhythm, and approval boundaries. That lets me prioritize like your pastoral secretary instead of acting like a generic task list.";
      }
      return "Create a church workspace first so I can keep your ministry context separate, ask the right questions, and connect tools safely.";
    }

    document.addEventListener("click", async event => {
      const navBtn = event.target.closest("[data-view]");
      if (navBtn) {
        state.view = navBtn.dataset.view;
        render();
        return;
      }

      const select = event.target.closest("[data-select]");
      if (select && !event.target.closest("button")) {
        try {
          state.selected = JSON.parse(select.dataset.select);
          state.selectedDetail = null;
          document.body.classList.add("detail-open");
          renderDetail();
          if (state.selected.type === "member" && state.mode === "live") await loadSelectedMember(state.selected.id);
        } catch {}
      }

      const actionEl = event.target.closest("[data-action]");
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      if (action === "open-form") openForm(actionEl.dataset.form, actionEl.dataset.member || "");
      if (action === "close-modal") closeModal();
      if (action === "close-detail") document.body.classList.remove("detail-open");
      if (action === "open-detail") document.body.classList.add("detail-open");
      if (action === "draft") draftFor(JSON.parse(actionEl.dataset.item));
      if (action === "static-draft") {
        const draft = JSON.parse(actionEl.dataset.draft);
        showDraft(draft.text, draft.title);
      }
      if (action === "integration-start") startIntegration(actionEl.dataset.provider);
      if (action === "integration-verify") await verifyIntegration(actionEl.dataset.provider);
      if (action === "integration-sync") await syncIntegration(actionEl.dataset.provider);
      if (action === "integration-disconnect") await disconnectIntegration(actionEl.dataset.provider);
      if (action === "policy-toggle") await togglePolicy(actionEl.dataset.provider, actionEl.dataset.enabled === "true");
      if (action === "prepare-actions") await prepareActions();
      if (action === "queue-draft") await queueDraftApproval(JSON.parse(actionEl.dataset.draftItem));
      if (action === "queue-calendar-block") await queueCalendarBlockApproval(JSON.parse(actionEl.dataset.calendarBlock));
      if (action === "action-open") await openAssistantAction(actionEl.dataset.actionId);
      if (action === "action-approve") await updateAssistantAction(actionEl.dataset.actionId, "approve");
      if (action === "action-execute") await updateAssistantAction(actionEl.dataset.actionId, "execute");
      if (action === "action-skip") await updateAssistantAction(actionEl.dataset.actionId, "skip");
      if (action === "done") markDone(JSON.parse(actionEl.dataset.item));
      if (action === "resolve-care") {
        if (state.mode === "demo") return toast("Demo mode previewed that action.");
        await api(`/care/${actionEl.dataset.id}/resolve`, { method: "POST", body: "{}" });
        toast("Care case resolved.");
        await loadData();
      }
      if (action === "tell") sendTell();
      if (action === "clear-chat") await clearChatHistory();
      if (action === "copy-draft") {
        const text = document.getElementById("draftText")?.value || "";
        await navigator.clipboard.writeText(text);
        toast("Copied.");
      }
      if (action === "copy-suggested") {
        const text = document.getElementById("suggestedDraft")?.textContent || "";
        await navigator.clipboard.writeText(text);
        toast("Copied.");
      }
    });

    document.addEventListener("submit", event => {
      const form = event.target.closest("form[data-submit]");
      if (!form) return;
      event.preventDefault();
      handleSubmit(form);
    });

    document.addEventListener("input", event => {
      if (event.target.id === "searchInput") {
        const position = event.target.selectionStart;
        state.search = event.target.value;
        renderPeople();
        const next = document.getElementById("searchInput");
        if (next) {
          next.focus();
          next.setSelectionRange(position, position);
        }
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
      if (event.key === "Enter" && event.target.id === "tellInput") sendTell();
    });

    document.addEventListener("click", event => {
      const prompt = event.target.closest("[data-prompt]");
      if (prompt) {
        const input = document.getElementById("tellInput");
        if (input) {
          input.value = prompt.dataset.prompt;
          input.focus();
        }
      }
    });

    els.modeBtn.addEventListener("click", async () => {
      state.mode = state.mode === "demo" ? "live" : "demo";
      state.selected = null;
      state.selectedDetail = null;
      setQueryMode();
      await loadData();
    });

    els.modal.addEventListener("click", event => {
      if (event.target === els.modal) closeModal();
    });

    loadData();
  </script>
</body>
</html>
